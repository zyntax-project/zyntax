# full_moon 2.2.0 (MPL-2.0, https://github.com/Kampfkarren/full-moon),
# vendored for three changes: a block accepts empty statements (`;;`),
# which Lua 5.2 and later allow anywhere a statement may stand, but
# not after the chunk's last statement (see src/ast/parsers.rs,
# `parse_block`, and src/ast/parser_structs.rs), and the lexer takes a vertical
# tab and a form feed as whitespace and lets `\z` skip every line
# break that follows, as Lua's does (see src/tokenizer/lexer.rs).
# Everything else is the published crate without its test corpus.

[package]
name = "full_moon"
version = "2.2.0"
authors = ["Kampfkarren <kampfkarren@gmail.com>"]
description = "A lossless Lua parser"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/Kampfkarren/full-moon"
categories = ["parsing"]
keywords = ["lua", "parser", "lua51", "lua52", "luau"]
edition = "2021"

[features]
default = ["serde"]
luau = ["roblox"]
roblox = ["luau"]
lua52 = []
lua53 = ["lua52"]
lua54 = ["lua53"]
luajit = []
cfxlua = ["lua54"]
no-source-tests = []

[dependencies]
bytecount = "0.6"
cfg-if = "1.0"
derive_more = { version = "1.0", features = ["display"] }
full_moon_derive = "=0.11.0"
paste = "1.0"
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
smol_str = { version = "0.3.1", features = ["serde"] }

[lints]
workspace = true
