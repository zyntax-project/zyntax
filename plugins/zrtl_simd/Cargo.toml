[package]
name = "zrtl_simd"
version = "0.1.0"
edition = "2021"
description = "SIMD-accelerated compute kernels for Zyntax runtime"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ZRTL SDK for plugin macro
zrtl = { path = "../../sdk/zrtl" }

# SIMD support with runtime feature detection
wide = "0.7"

# Kernels shared with the plugins that build on this one
zrtl_simd_kernels = { path = "../../sdk/zrtl_simd_kernels" }

[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
