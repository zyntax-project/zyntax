[package]
name = "zrtl_svg"
version = "0.1.0"
edition = "2021"
description = "ZRTL SVG plugin - SVG parsing and rendering"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zrtl = { path = "../../sdk/zrtl" }
resvg = "0.37"
usvg = "0.37"
tiny-skia = "0.11"

[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
