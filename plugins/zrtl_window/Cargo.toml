[package]
name = "zrtl_window"
version = "0.1.0"
edition = "2021"
description = "ZRTL Window plugin - cross-platform windowing with events"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zrtl = { path = "../../sdk/zrtl" }
# Use SDL2 as the backend for cross-platform windowing
sdl2 = { version = "0.36", features = ["bundled"] }

[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
