[package]
name = "zrtl_model"
version = "0.1.0"
edition = "2021"
description = "Model loading and serialization for Zyntax runtime (ZynML)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ZRTL SDK for plugin macro
zrtl = { path = "../../sdk/zrtl" }

# SafeTensors format (HuggingFace standard)
safetensors = "0.4"

# Memory mapping for large files
memmap2 = "0.9"


[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
