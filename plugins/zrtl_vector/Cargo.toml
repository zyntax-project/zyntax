[package]
name = "zrtl_vector"
version = "0.1.0"
edition = "2021"
description = "Vector search and embedding operations for Zyntax runtime (ZynML)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# ZRTL SDK for plugin macro
zrtl = { path = "../../sdk/zrtl" }

# SIMD operations for high-performance compute
zrtl_simd_kernels = { path = "../../sdk/zrtl_simd_kernels" }

# Parallel processing for batch operations
rayon = "1.10"

[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
