[package]
name = "zrtl_regex"
version = "0.1.0"
edition = "2021"
description = "ZRTL Regex plugin - regular expression matching and replacement"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zrtl = { path = "../../sdk/zrtl" }
regex = "1.10"

[lints]
workspace = true

[features]
# Suppress the unmangled `_zrtl_info` / `_zrtl_symbols` exports, which
# every plugin defines under the same names. A host that links more than
# one plugin needs them gone and uses `static_plugin()` instead.
linked-into-host = []
