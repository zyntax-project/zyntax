[package]
name = "krio_adapter"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Adapter wiring zyntax HIR into krio-async's CFG-shaped CoroCfg / AsyncHooks / SuspendingFns traits"

[dependencies]
zyntax_typed_ast = { path = "../../typed_ast" }
zyntax_compiler  = { path = "../../compiler" }

# Pinned to a specific commit on the upstream krio repo. Phase G
# improvements (TransformOptions::reserved_slots, validate_layout,
# host-gotcha docs) ship in commit fe0177c. Bump the rev when newer
# krio fixes / features land.
krio-async     = { git = "https://github.com/darmie/krio.git", package = "krio-async",     rev = "fe0177c" }
krio-stackless = { git = "https://github.com/darmie/krio.git", package = "krio-stackless", rev = "fe0177c" }
krio-core      = { git = "https://github.com/darmie/krio.git", package = "krio-core",      rev = "fe0177c" }

log = "0.4"
indexmap = "2"
smallvec = "1.13"

[dev-dependencies]
indexmap = "2"

[lints]
workspace = true
