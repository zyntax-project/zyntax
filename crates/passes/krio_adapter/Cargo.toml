[package]
name = "krio_adapter"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Adapter wiring zyntax HIR into krio-async's CFG-shaped CoroCfg / AsyncHooks / SuspendingFns traits"

[dependencies]
zyntax_typed_ast = { path = "../../typed_ast" }
zyntax_compiler  = { path = "../../compiler" }

# Local path to the sibling krio workspace. Pinned to absolute path
# while we iterate; once the integration is stable we'll either
# vendor it or pull from a published release.
krio-async     = { path = "../../../../krio/crates/krio-async" }
krio-stackless = { path = "../../../../krio/crates/krio-stackless" }
krio-core      = { path = "../../../../krio/crates/krio-core" }

log = "0.4"
indexmap = "2"
smallvec = "1.13"

[dev-dependencies]
indexmap = "2"

[lints]
workspace = true
