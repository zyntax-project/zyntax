[package]
name = "krio_adapter"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Adapter wiring zyntax HIR into krio-async's CFG-shaped CoroCfg / AsyncHooks / SuspendingFns traits"

[dependencies]
zyntax_typed_ast = { path = "../../typed_ast" }
# default-features=false so krio_adapter doesn't force the cranelift
# / dynamic-plugins features on downstream crates that use it from a
# `parse-only` build. Backend features are activated by the consumer
# (zyntax_embed's `native` feature).
zyntax_compiler  = { path = "../../compiler", default-features = false }

# Pinned to a specific commit on the upstream krio repo. Bumped to
# 1051689 (krio-fiber Windows port + CI infrastructure; no changes
# to the krio-async / krio-stackless / krio-core APIs zyntax uses).
# Bump the rev when newer krio fixes / features land.
krio-async     = { git = "https://github.com/darmie/krio.git", package = "krio-async",     rev = "9466253" }
krio-stackless = { git = "https://github.com/darmie/krio.git", package = "krio-stackless", rev = "9466253" }
krio-core      = { git = "https://github.com/darmie/krio.git", package = "krio-core",      rev = "9466253" }
# Stackful fibers (per-fiber mmap stack + arch-specific context
# switch). Drives the default `FiberCfg` impl for first-class fiber
# HIR ops on native targets.
krio-fiber     = { git = "https://github.com/darmie/krio.git", package = "krio-fiber",     rev = "9466253" }

log = "0.4"
indexmap = "2"
smallvec = "1.13"

[dev-dependencies]
indexmap = "2"

[lints]
workspace = true
