[package]
name = "zyntax_python"
version = "0.1.0"
edition = "2024"
description = "A Python frontend for Zyntax: ruff's AST to a TypedProgram"

[features]
llvm-backend = ["zyntax_embed/llvm-backend"]

[[bin]]
name = "zypy"
path = "src/main.rs"

[dependencies]
zyntax_typed_ast = { path = "../typed_ast" }
zyntax_embed = { path = "../zyntax_embed" }
zyntax_compiler = { path = "../compiler" }
zyntax_builtins = { path = "../zyntax_builtins" }
# The plugins a Python program links: the primitives the built-in
# library is written against.
zrtl = { path = "../../sdk/zrtl" }
zrtl_io = { path = "../../plugins/zrtl_io", features = ["linked-into-host"] }
zrtl_string = { path = "../../plugins/zrtl_string", features = ["linked-into-host"] }
zrtl_math = { path = "../../plugins/zrtl_math", features = ["linked-into-host"] }
# Pinned exactly: the crate publishes 0.0.x and makes no semver promise.
ruff_python_parser = "=0.0.12"
ruff_python_ast = "=0.0.12"
thiserror = "1"
ruff_text_size = "=0.0.12"
indexmap = "2"
# The frontend keys its tables by name; the default hasher is a fifth
# of inference on a class-heavy program.
rustc-hash = "2"
# `_exit` at the end of a run: the process, not the runtime, frees.
libc = "0.2"

[build-dependencies]
zyntax_typed_ast = { path = "../typed_ast" }
zyntax_embed = { path = "../zyntax_embed", default-features = false, features = ["parse-only"] }
zyntax_compiler = { path = "../compiler", default-features = false }
zyntax_builtins = { path = "../zyntax_builtins" }
indexmap = "2"

