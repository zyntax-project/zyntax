[package]
name = "zyntax_python"
version = "0.1.0"
edition = "2021"
description = "A Python frontend for Zyntax: ruff's AST to a TypedProgram"

[[bin]]
name = "zypy"
path = "src/main.rs"

[dependencies]
zyntax_typed_ast = { path = "../typed_ast" }
zyntax_embed = { path = "../zyntax_embed" }
zyntax_compiler = { path = "../compiler" }
zyntax_builtins = { path = "../zyntax_builtins" }
# The plugins a Python program links: the primitives the built-in
# library is written against.
zrtl_io = { path = "../../plugins/zrtl_io", features = ["linked-into-host"] }
zrtl_string = { path = "../../plugins/zrtl_string", features = ["linked-into-host"] }
# Pinned exactly: the crate publishes 0.0.x and makes no semver promise.
ruff_python_parser = "=0.0.12"
ruff_python_ast = "=0.0.12"
thiserror = "1"
ruff_text_size = "=0.0.12"

[dev-dependencies]
