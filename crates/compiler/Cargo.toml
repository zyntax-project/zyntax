[package]
name = "zyntax_compiler"
version = "0.1.0"
edition = "2021"
authors = ["Damilare Akinlaja"]
description = "Layered compilation system for Zyntax language"

[dependencies]
# Parser dependency
zyntax_typed_ast = { path = "../typed_ast", features = ["operator_traits"] }
pattern_engine = { path = "../pattern_engine" }
normalization_pass = { path = "../passes/normalization" }
algebraic_effects_pass = { path = "../passes/algebraic_effects" }

# Core data structures
dashmap = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }

# Analysis and optimization
petgraph = "0.6.4"  # Graph algorithms
smallvec = "1.13.2"  # Optimized small vectors
indexmap = { version = "2.2.6", features = ["serde"] }  # Ordered maps with serde support
bit-set = "0.5.3"  # Bit sets for liveness analysis

# Serialization for caching
serde = { workspace = true }
serde_json = { workspace = true }
bincode = "1.3.3"  # Fast binary serialization
postcard = { version = "1.0", features = ["alloc"] }  # Compact binary format for bytecode
crc32fast = "1.4"  # CRC32 checksums for bytecode validation

# Error handling
thiserror = { workspace = true }
miette = "7.2.0"

# Logging
log = "0.4"

# Utilities
uuid = { workspace = true }
tempfile = { workspace = true }
rayon = { workspace = true }
fnv = "1.0.7"  # Fast hash function

# Dynamic library loading for ZRTL plugins (native targets only).
# Optional so the crate can build for wasm32, which has no dlopen.
libloading = { version = "0.8", optional = true }

# Lazy initialization for global state
once_cell = "1.19"

# Archive format for ZPack. default-features=false drops bzip2/lzma
# native build-deps that don't compile for wasm32; only `deflate` is
# actually used by zpack archives.
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Hot-function promotion broker for interpreter-to-JIT tiering
beadie = "0.3"

# Optional features for backend support
cranelift = { version = "0.106", optional = true }
cranelift-codegen = { version = "0.106", optional = true }
cranelift-frontend = { version = "0.106", optional = true }
cranelift-jit = { version = "0.106", optional = true }
cranelift-module = { version = "0.106", optional = true }
cranelift-native = { version = "0.106", optional = true }
inkwell = { version = "0.7.1", features = ["llvm21-1"], optional = true }  # LLVM bindings

# Wasm encoder for the hot-function tier-1 JIT (Phase E). Optional
# so non-wasm-target builds don't pay the dep cost.
wasm-encoder = { version = "0.213", optional = true }
# Module validator — codegen unit tests use it to assert the emitter's
# output is structurally well-formed before wiring it into the host.
wasmparser = { version = "0.213", optional = true }

[dev-dependencies]
env_logger = "0.11"
criterion = "0.5"

[[bench]]
name = "simd_vectorization"
harness = false

[features]
default = ["cranelift-backend", "dynamic-plugins"]
cranelift-backend = ["cranelift", "cranelift-codegen", "cranelift-frontend", "cranelift-jit", "cranelift-module", "cranelift-native"]
llvm-backend = ["inkwell"]
# Wasm-emitting tier-1 JIT for hot HIR functions (Phase E). The
# emitter itself works on any host; the consumer (wasm runtime)
# turns the emitted bytes into an instantiated module.
wasm-jit = ["wasm-encoder", "wasmparser"]
all-backends = ["cranelift-backend", "llvm-backend", "wasm-jit"]
# `dynamic-plugins` enables runtime loading of ZRTL plugins from `.zrtl`
# files via libloading (dlopen). Off for wasm32 targets — see the
# wasm-build plan at /Users/amaterasu/.claude/plans/effervescent-pondering-sutton.md
dynamic-plugins = ["libloading"]

[lints]
workspace = true
