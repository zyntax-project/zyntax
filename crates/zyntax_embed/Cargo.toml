[package]
name = "zyntax_embed"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for embedding Zyntax as a JIT runtime with bidirectional value interop"
license = "Apache-2.0"
repository = "https://github.com/darmie/zyntax"
keywords = ["compiler", "jit", "runtime", "embedding", "interop"]
categories = ["compilers", "development-tools"]

[dependencies]
# default-features=false so that zyntax_embed's `parse-only` feature
# can build without Cranelift / libloading. The `native` feature re-
# enables `cranelift-backend` and `dynamic-plugins` transitively.
zyntax_compiler = { path = "../compiler", default-features = false }
zyn_peg = { path = "../zyn_peg" }
zyntax_typed_ast = { path = "../typed_ast" }
# Phase C: the StaticPlugin accessor type comes from the SDK so the
# `zrtl_plugin!` macro can hand it back to ZyntaxRuntime without a
# `dlopen`. Lightweight pure-Rust dep; works on wasm32 too.
zrtl = { path = "../../sdk/zrtl" }
pattern_engine = { path = "../pattern_engine" }
normalization_pass = { path = "../passes/normalization" }
algebraic_effects_pass = { path = "../passes/algebraic_effects" }
krio_adapter = { path = "../passes/krio_adapter" }
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
# Positional binary encoding for the grammar artifact. CBOR names every
# field in the payload and matches those names on the way back in, which
# a 417-rule grammar pays for on every startup.
postcard = { version = "1.0", features = ["alloc"] }
indexmap = "2.0"

# Dynamic grammar parsing at runtime
pest = "2.7"
pest_meta = "2.8"
pest_vm = "2.8"

# Hot-function promotion broker (interp→JIT tier-up). Default features
# off so no cranelift/llvm is dragged in on wasm targets; we only use
# the core orchestrator API (Beadie, Bead, ThresholdPolicy, on_invoke).
beadie = { version = "0.3", default-features = false }

# std::time::Instant panics on wasm32-unknown-unknown ("time not
# implemented on this platform"). web-time is API-compatible with
# std::time on native and routes through performance.now() on wasm.
web-time = "1"

[dev-dependencies]

[features]
# Default: native build with Cranelift JIT + libloading-backed ZRTL
# plugins. Existing native callers do not need to change anything.
default = ["native"]

# `native` activates the full native runtime: Cranelift JIT, dynamic
# `.zrtl` plugin loading via `dlopen`, and the cranelift-backend code
# paths in zyntax_compiler. Includes `krio-async-backend`: krio's
# captures-lift state machine is now the async path (the legacy
# `async_support.rs` captures-lift bug is resolved — all 14 formerly-
# ignored tests pass through krio).
native = [
    "zyntax_compiler/cranelift-backend",
    "zyntax_compiler/dynamic-plugins",
    "dynamic-plugins",
    "krio-async-backend",
]

# `parse-only` builds zyntax_embed without any native backend or
# plugin loading — parser + TypedAST + transformation passes only.
# Intended for environments that can't host a JIT (wasm32 target,
# tooling integrations, IDE servers).
parse-only = []

# `dynamic-plugins` enables runtime `.zrtl` plugin loading via
# libloading. Implied by `native`. Disabled on wasm32 since dlopen
# isn't available; wasm builds register plugins statically (Phase C).
dynamic-plugins = []

llvm-backend = ["zyntax_compiler/llvm-backend"]
all-backends = ["zyntax_compiler/all-backends", "llvm-backend"]
# Use krio-async's captures-lift state-machine transform for async
# functions. Enabled by `native` (the default). Kept as a separate
# feature so `parse-only` / non-native builds can opt out, and so the
# legacy `async_support.rs` path stays reachable for A/B debugging by
# building with `--no-default-features`.
# krio_adapter is an unconditional dep (needed by
# `apply_krio_effect_lowering` for resumable-effect fns regardless of
# this feature). With the feature set, async fns go through krio's
# captures-lift; without, the legacy `async_support` path handles them.
krio-async-backend = []

[lints]
workspace = true
