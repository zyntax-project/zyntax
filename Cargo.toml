[workspace]
resolver = "2"
members = [
    "crates/typed_ast",
    "crates/compiler",
    "crates/whirlwind_adapter",
    "crates/zyntax_cli",
    "crates/runtime",
    "crates/zyntax_plugin_macros",
    "crates/zyn_peg",
    "crates/haxe_zyntax_runtime",
    "crates/zyntax_embed",
    "crates/zyntax_wasm",
    "crates/zynml",
    "crates/pattern_engine",
    "crates/passes/normalization",
    "crates/passes/algebraic_effects",
    "crates/passes/krio_adapter",
    "sdk/zrtl",
    "sdk/zrtl_macros",
    "examples/imagepipe",
]


[workspace.dependencies]
rayon = "1.10.0"
dashmap = "6.1.0"
crossbeam = "0.8.4"
parking_lot = "0.12.3"
thiserror = "2.0.11"
serde_json = "1.0.138"
serde = {version= "1.0.217", features = ["derive"]}
tempfile = "3.16.0"
colored = "3.0.0"
lazy_static = "1.5.0"
regex = "1.11.1"
# `js` enables web-sys-backed randomness on wasm32-unknown-unknown.
# It's a no-op on native targets; safe to set unconditionally.
uuid = { version = "1.10.0", features = ["v4", "serde", "js"] }
miette = "7.2.0"
typed-arena = "2.0.2"
string-interner = "0.17.0"
ariadne = "0.5"

[workspace.lints.rust]
warnings = "allow"

[workspace.lints.clippy]
all = "allow"

# Debug builds keep line tables and drop the rest of the DWARF.
#
# Backtraces still name a file and a line, which is what they are read
# for; stepping in a debugger and inspecting locals is what goes. On
# macOS the default `split-debuginfo = "unpacked"` leaves one object file
# per codegen unit beside each binary, and the executable's debug map
# points into them, so cargo cannot remove them when a crate is rebuilt
# under a new hash. Every rebuild leaves a full set behind, and the
# volume of each set is set here.
[profile.dev]
debug = "line-tables-only"
