[package]
name = "zrtl_macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for creating ZRTL (Zyntax Runtime Library) plugins"
license = "Apache-2.0"
repository = "https://github.com/zyntax-project/zyntax"
keywords = ["compiler", "jit", "runtime", "macros", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "compilers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "derive"] }

[lints]
workspace = true
